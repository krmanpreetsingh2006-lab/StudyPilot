<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudyPilot</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🚀 StudyPilot</h1>
    <p>Adaptive Study Planner</p>

    <button id="logoutBtn" class="secondary hidden">
      Logout
    </button>
  </header>


  <main>

    <!-- ================= LOGIN ================= -->

    <section id="authCard" class="card">

      <h2>Student Login</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <div class="row">

        <button id="loginBtn">
          Login
        </button>

        <button id="signupBtn" class="secondary">
          Create Account
        </button>

      </div>

      <p id="authMsg"></p>

    </section>



    <!-- ================= MAIN APP ================= -->

    <section id="app" class="hidden">


      <!-- ADD SUBJECT -->

      <div class="card">

        <h2>📚 Add Subject</h2>

        <input
          id="subject"
          placeholder="Subject e.g. Physics"
        >

        <input
          id="topics"
          placeholder="Topics (comma separated)"
        >

        <input
          id="examDate"
          type="date"
        >

        <input
          id="hours"
          type="number"
          min="1"
          max="12"
          value="2"
          placeholder="Daily study hours"
        >

        <button id="addBtn">
          Add & Generate Plan
        </button>

      </div>



      <!-- TODAY -->

      <div class="card">

        <h2>📅 Today's Tasks</h2>

        <div id="todayTasks"></div>

      </div>



      <!-- ALL TASKS -->

      <div class="card">

        <h2>📝 All Study Tasks</h2>

        <div id="tasks"></div>

        <button id="adjustBtn" class="secondary">
          🔄 Smart Adjust Plan
        </button>

      </div>



      <!-- PROGRESS -->

      <div class="card">

        <h2>📊 Progress</h2>

        <div class="progress">

          <div id="progressBar"></div>

        </div>

        <p id="progressText">
          0% completed
        </p>

      </div>



      <!-- SUBJECTS -->

      <div class="card">

        <h2>📖 Subjects</h2>

        <div id="subjects"></div>

      </div>


    </section>

  </main>


  <script type="module" src="app.js"></script>

</body>

</html>
